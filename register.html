
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for Flood Alerts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background -->
    <div class="bg">
        <div class="bg__glow"></div>
        <div class="bg__grid"></div>
        <div class="waves" aria-hidden="true">
            <div class="wave wave--1"></div>
            <div class="wave wave--2"></div>
            <div class="wave wave--3"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="header" role="banner">
        <div class="container">
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <h1>Tubig Patrol</h1>
                    <p class="tagline">Area Flood Detection and Monitoring Website • Prototype</p>
                </div>
            </a>
            <nav class="nav">
                <a href="map.html">Map</a>
                <a href="register.html">Register</a>
                <a href="index.html#about">About</a>
                <a href="index.html#how-it-works">How It Works</a>
                <a href="index.html#symbols">Symbols</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <section class="card register-card">
                <h2>Register for Flood Water Level Alerts</h2>
                <form id="register-form" class="register-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="phone">Mobile Number</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" placeholder="09XXXXXXXXX" required class="form-input">
                    </div>
                    <button type="submit" class="btn register-btn">Register</button>
                </form>
                <div id="message" class="register-message"></div>
            </section>
        </div>
    </main>
    <style>
    .register-card {
        margin-top: 110px;
        max-width: 420px;
        margin-left: auto;
        margin-right: auto;
        padding: 32px 28px;
        background: rgba(255,255,255,0.07);
        border-radius: var(--radius);
        box-shadow: 0 8px 32px rgba(51,214,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
    }
    .register-card h2 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 24px;
        color: var(--accent2);
        text-align: center;
    }
    .register-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .form-group label {
        font-size: 14px;
        color: var(--muted);
        font-weight: 500;
    }
    .form-input {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(51,214,255,0.18);
        background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
        color: var(--text);
        font-size: 15px;
        font-family: inherit;
        transition: box-shadow 0.3s, border-color 0.3s;
        outline: none;
    }
    .form-input:focus {
        box-shadow: 0 0 0 2px rgba(51,214,255,0.18);
        border-color: var(--accent);
    }
    .register-btn {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #00131c;
        border: 1px solid rgba(255,255,255,0.14);
        padding: 12px 0;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 700;
        font-size: 16px;
        transition: all 0.3s;
        box-shadow: 0 8px 24px rgba(51,214,255,0.12);
    }
    .register-btn:hover {
        filter: brightness(1.05);
    }
    .register-message {
        margin-top: 18px;
        color: var(--good);
        font-size: 15px;
        text-align: center;
    }
    @media (max-width: 600px) {
        .register-card {
            margin-top: 90px;
            padding: 18px 8px;
        }
    }
    </style>
    </main>
<script>
  const REPLIT_BASE_URL = "https://flood-proxy--aeroljadraque.replit.app";

  const form = document.getElementById("register-form");
  const messageEl = document.getElementById("message");

  function setMessage(text, isError = false) {
    messageEl.textContent = text;
    messageEl.style.color = isError ? "var(--warn)" : "var(--good)";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();

    // Basic client-side validation (you already use pattern="[0-9]{11}")
    if (!/^\d{11}$/.test(phone) || !phone.startsWith("09")) {
      setMessage("Please enter a valid PH mobile number (11 digits, starts with 09).", true);
      return;
    }

    setMessage("Registering...");

    try {
      const resp = await fetch(`${REPLIT_BASE_URL}/subscribe`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, phone })
      });

      const data = await resp.json();

      if (!resp.ok) {
        setMessage(data?.error || "Registration failed.", true);
        return;
      }

      setMessage("Registered! You will receive flood water level alerts via SMS.");
      form.reset();
    } catch (err) {
      setMessage("Network error. Please try again.", true);
      console.error(err);
    }
  });
</script>
</body>
</html>
