<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tubig Patrol - Interactive Map</title>
    <link rel="icon" type="image/png" href="TUBIG PATROL LOGO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.1/dist/Control.Geocoder.css" />
</head>
<body class="map-page">
    <!-- Header -->
    <header class="header" role="banner">
        <div class="container">
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <h1>Tubig Patrol</h1>
                    <p class="tagline">Area Flood Detection and Monitoring Website • Prototype</p>
                </div>
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation menu">&#9776;</button>
            <nav class="nav" id="site-nav">
                <a href="map.html">Map</a>
                <a href="index.html#about">About</a>
                <a href="index.html#how-it-works">How It Works</a>
                <a href="index.html#symbols">Symbols</a>
                <a href="register.html">Register</a>
                <a href="unsubscribe.html">Unsubscribe</a>
            </nav>
        </div>
    </header>

    <!-- Map Container -->
    <div id="map" class="map-container"></div>

    <!-- Search Box (Floating) -->
    <div class="map-search-overlay">
        <div class="search" id="search">
            <div class="search__bar" role="search">
                <span class="search__icon" aria-hidden="true">⌕</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search__input" 
                    placeholder="Search city, barangay, landmark…"
                    autocomplete="off"
                >
                <button id="searchButton" class="search__btn">Search</button>
            </div>
        </div>
    </div>

    <!-- Legend (Optional) -->
    <div class="map-legend">
        <h3>Flood Levels</h3>
        <div class="legend-item">
            <img src="NO DATA.png" alt="No Data" class="legend-icon">
            <span>No Data</span>
        </div>
        <div class="legend-item">
            <img src="LOW.png" alt="Low" class="legend-icon">
            <span>Low</span>
        </div>
        <div class="legend-item">
            <img src="MODERATE.png" alt="Moderate" class="legend-icon">
            <span>Moderate</span>
        </div>
        <div class="legend-item">
            <img src="HIGH.png" alt="High" class="legend-icon">
            <span>High</span>
        </div>
        <div class="legend-item">
            <img src="CRITICAL.png" alt="Critical" class="legend-icon">
            <span>Critical</span>
        </div>
    </div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder@2.4.1/dist/Control.Geocoder.js"></script>
    
    <!-- Map Script -->
    <script src="main.js"></script>
    <script src="map.js"></script>
    <script src="dynamic-marker.js"></script>
    <script src="cloud-fetch.js"></script>
</html>
